include = ["**/*.rs"]
exclude = ["target/**", ".jevlint/**"]
rules_dir = ".jevlint-rules"
system_prompt = ".jevlint-system.md"
cache_dir = ".jevlint"
model = "jev-latest"
concurrency = 5
request_timeout_seconds = 30

[line_detection]
enabled = true
max_questions_per_request = 200

[watch]
debounce_milliseconds = 300

# A nonzero result safely skips every selected file. The command runs once per pass.
# [precondition]
# command = ["cargo", "check", "--quiet"]
