include = ["*.ts", "*.tsx", "**/*.ts", "**/*.tsx"]
exclude = [
  "node_modules/**",
  "dist/**",
  "build/**",
  "coverage/**",
  ".next/**",
  ".jevlint/**",
  "**/*.d.ts",
  "**/*.generated.ts",
]
rules_dir = ".jevlint-rules"
system_prompt = ".jevlint-system.md"
cache_dir = ".jevlint"
model = "jev-latest"
concurrency = 5
request_timeout_seconds = 30
typesafe_api_key_file = "~/.config/jevlint/typesafe-api-key"

[[overrides]]
files = ["*.ts", "*.tsx", "**/*.ts", "**/*.tsx"]
rules = ["no-floating-promises", "no-unvalidated-boundary-cast"]

[rule_severity]
no-floating-promises = "error"
no-unvalidated-boundary-cast = "warning"

[line_detection]
enabled = true
max_questions_per_request = 200

[watch]
debounce_milliseconds = 300

[precondition]
command = [
  "sh",
  "-c",
  "pnpm exec tsc --noEmit --pretty false && pnpm exec biome check .",
]
