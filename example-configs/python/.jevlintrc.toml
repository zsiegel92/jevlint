include = ["*.py", "*.pyi", "**/*.py", "**/*.pyi"]
exclude = [
  ".venv/**",
  "venv/**",
  ".tox/**",
  ".nox/**",
  ".mypy_cache/**",
  ".pyright/**",
  ".ruff_cache/**",
  "build/**",
  "dist/**",
  ".jevlint/**",
  "**/migrations/**",
  "**/*_pb2.py",
]
rules_dir = ".jevlint-rules"
system_prompt = ".jevlint-system.md"
cache_dir = ".jevlint"
model = "jev-latest"
concurrency = 5
request_timeout_seconds = 30
typesafe_api_key_file = "~/.config/jevlint/typesafe-api-key"

[[overrides]]
files = ["*.py", "*.pyi", "**/*.py", "**/*.pyi"]
rules = ["no-broad-exception-swallowing", "no-unvalidated-dynamic-data"]

[rule_severity]
no-broad-exception-swallowing = "error"
no-unvalidated-dynamic-data = "warning"

[line_detection]
enabled = true
max_questions_per_request = 200

[watch]
debounce_milliseconds = 300

[precondition]
command = ["sh", "-c", "pyright && ruff check ."]
